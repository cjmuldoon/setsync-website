<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get SetSync for Android</title>
    <meta name="description" content="Download SetSync for Android.">
    <link rel="canonical" href="https://play.google.com/store/apps/details?id=com.setsync.app">
    <link rel="icon" type="image/png" href="../favicon.png">
    <!-- Short redirect so QR codes stay low-density and scannable: the raw
         store URLs are long enough to push the codes to a module count that
         stops resolving once the image is displayed small. Keep these paths
         short for that reason. -->
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.setsync.app">
    <meta name="robots" content="noindex">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0A0A0E;
            color: #F5F5F7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 24px;
        }
        a { color: #FF6B00; }
        img { width: 92px; height: 92px; margin-bottom: 20px; }
        p { color: #9A9AA2; font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <img src="../logo-icon.png" alt="SetSync">
        <h1>Opening Google Play</h1>
        <!-- Anyone with JS and meta-refresh disabled still gets a way through. -->
        <p>If nothing happens, <a href="https://play.google.com/store/apps/details?id=com.setsync.app">tap here to get SetSync for Android</a>.</p>
    </main>
    <script>window.location.replace("https://play.google.com/store/apps/details?id=com.setsync.app");</script>
</body>
</html>
